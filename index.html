<h2>Belajar JavaScript</h2>
<div id="hasil"></div>

<script>
  // 1. console.log()
  console.log("Halo, ini pesan dari console.log()");

  // 2. alert()
  alert("Selamat datang di belajar JavaScript!");

  // 3. prompt()
  let nama = prompt("Masukkan nama Anda:");

  // Menampilkan hasil ke console
  console.log("Nama yang dimasukkan:", nama);

  // Menampilkan alert
  alert("Halo, " + nama + "!");

  // Menampilkan hasil di halaman browser
  document.getElementById("hasil").innerHTML = `
    <p><strong>Pesan Console:</strong> Halo, ini pesan dari console.log()</p>
    <p><strong>Nama Anda:</strong> ${nama}</p>
    <p><strong>Halo, ${nama}!</strong></p>
  `;
</script>
